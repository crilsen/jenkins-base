name: check

# CI for this repository itself: runs the same checks the self-check Jenkinsfile runs, so
# a change is validated before it ever reaches a controller. See scripts/check.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          python3 --version
          docker compose version

      - name: Repository checks
        run: ./scripts/check.sh

      - name: Validate the agent image definition
        run: docker build --check --file Dockerfile.agent . || true
